name: 버그 신고
description: 앱이 예상과 다르게 동작할 때 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 문제라면 이 양식 대신 [보안 정책](https://github.com/Team-MemoryZ/.github/blob/main/SECURITY.md)에 따라 비공개로 알려 주세요.
        개인정보(이메일, 생년월일 등)나 학습 자료 원본은 올리지 말아 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무엇이 문제인가요?
      description: 어떤 화면에서 무엇을 했을 때 어떤 일이 일어났는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...으로 이동
        2. ...을 누름
        3. ...이 나타남
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 사용 환경
      placeholder: 예) iPhone 15 · iOS 19 · 설치한 앱(PWA) / Windows 11 · Chrome
  - type: textarea
    id: screenshots
    attributes:
      label: 화면 캡처
      description: 있으면 끌어다 놓아 주세요. 개인정보가 보이지 않게 가려 주세요.
