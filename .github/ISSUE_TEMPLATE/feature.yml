name: 기능 제안
description: 있으면 좋을 기능이나 개선점을 제안해 주세요.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편을 해결하고 싶나요?
      description: 공부하면서 겪은 상황을 구체적으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 공부하는 분야, 쓰는 기기 등 도움이 될 만한 내용을 적어 주세요.
